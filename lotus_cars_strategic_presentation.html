        // Active State variables
        let currentSlideIndex = 0;
        let isSpeakerNotesVisible = true;
        let autoplayInterval = null;
        let timerSeconds = 0;
        let timerInterval = null;

        // Dom Elements Cached
        const slideViewport = document.getElementById('slide-viewport');
        const slideIndicator = document.getElementById('slide-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const autoplayBtn = document.getElementById('autoplay-btn');
        const navDotsContainer = document.getElementById('nav-dots');
        const speakerNotesPanel = document.getElementById('speaker-notes-panel');
        const speakerNotesContent = document.getElementById('speaker-notes-content');
        const speakerNotesToggle = document.getElementById('speaker-notes-toggle');
        const presentationTimer = document.getElementById('presentation-timer');
        const resetTimerBtn = document.getElementById('reset-timer');

        // Initialize Slides & Navigation dots
        function initApp() {
            // Build visual progress navigation dots
            navDotsContainer.innerHTML = '';
            SLIDES.forEach((slide, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-7 h-2 rounded transition-all duration-300 ${idx === 0 ? 'bg-gold w-10' : 'bg-zinc-800 hover:bg-zinc-600'}`;
                dot.title = `Go to Slide ${idx + 1}: ${slide.title}`;
                dot.onclick = () => jumpToSlide(idx);
                navDotsContainer.appendChild(dot);
            });

            // Set up Slide
            renderSlide();
            startTimer();

            // Setup listeners
            prevBtn.onclick = handlePrev;
            nextBtn.onclick = handleNext;
            autoplayBtn.onclick = handleAutoplayToggle;
            speakerNotesToggle.onclick = handleSpeakerNotesToggle;
            resetTimerBtn.onclick = resetTimer;

            // Arrow keys handling
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') handleNext();
                if (e.key === 'ArrowLeft') handlePrev();
            });
        }

        // Render Active Slide on Screen and update indicators
        function renderSlide() {
            const slide = SLIDES[currentSlideIndex];
            
            // Apply Fade Transition effect
            slideViewport.style.opacity = 0;
            setTimeout(() => {
                slideViewport.innerHTML = slide.html;
                slideViewport.style.opacity = 1;
            }, 150);

            // Update bottom pagination metadata
            slideIndicator.innerText = `Slide ${currentSlideIndex + 1} of ${SLIDES.length}`;

            // Update interactive Dots
            Array.from(navDotsContainer.children).forEach((dot, idx) => {
                if (idx === currentSlideIndex) {
                    dot.className = "w-10 h-2 rounded bg-gold transition-all duration-300";
                } else {
                    dot.className = "w-7 h-2 rounded bg-zinc-800 hover:bg-zinc-700 transition-all duration-300";
                }
            });

            // Update speaker guide
            speakerNotesContent.innerHTML = slide.speakerNotes;

            // Handle Prev/Next disabled limits
            prevBtn.disabled = currentSlideIndex === 0;
            nextBtn.disabled = currentSlideIndex === SLIDES.length - 1;
        }

        function handlePrev() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide();
            }
        }

        function handleNext() {
            if (currentSlideIndex < SLIDES.length - 1) {
                currentSlideIndex++;
                renderSlide();
            } else {
                // Wrap around at end of autoplay
                if (autoplayInterval) {
                    currentSlideIndex = 0;
                    renderSlide();
                }
            }
        }

        function jumpToSlide(index) {
            currentSlideIndex = index;
            renderSlide();
        }

        // Handle Slide Autoplay loop
        function handleAutoplayToggle() {
            if (autoplayInterval) {
                clearInterval(autoplayInterval);
                autoplayInterval = null;
                autoplayBtn.innerText = "Play";
                autoplayBtn.classList.remove('bg-emerald-600', 'text-white');
                autoplayBtn.classList.add('bg-zinc-800', 'text-gold');
            } else {
                autoplayInterval = setInterval(() => {
                    handleNext();
                }, 6000); // 6 Seconds auto slide transition
                autoplayBtn.innerText = "Pause";
                autoplayBtn.classList.remove('bg-zinc-800', 'text-gold');
                autoplayBtn.classList.add('bg-emerald-600', 'text-white');
            }
        }

        // Toggle Speaker cues pane view
        function handleSpeakerNotesToggle() {
            isSpeakerNotesVisible = !isSpeakerNotesVisible;
            if (isSpeakerNotesVisible) {
                speakerNotesPanel.classList.remove('hidden');
                speakerNotesToggle.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    <span>Speaker Notes (ON)</span>
                `;
            } else {
                speakerNotesPanel.classList.add('hidden');
                speakerNotesToggle.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <span>Speaker Notes (OFF)</span>
                `;
            }
        }

        // Practical stopwatch timer for checking academic length goals
        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
                const secs = (timerSeconds % 60).toString().padStart(2, '0');
                presentationTimer.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function resetTimer() {
            timerSeconds = 0;
            presentationTimer.innerText = "00:00";
        }

        // Run application on load
        window.onload = initApp;
    </script>
